[project]
name = "mqtt-trust-gateway-tests"
version = "0.1.0"
description = "Integration tests for MQTT Trust Gateway"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0,<46.0.0",
  "paho-mqtt>=2.1.0,<3.0.0",
  "pytest>=8.0.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
